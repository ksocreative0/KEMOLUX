<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KÉMOLUX | Reset Password</title><link rel="stylesheet" href="global.css"><link rel="stylesheet" href="admin.css"></head><body><main class="welcome-container"><section class="auth-card"><h1 class="brand-name">KÉMOLUX</h1><p class="tagline">Elegance Within Reach</p><h2>Choose a new password</h2><form id="reset-password-form"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" autocomplete="new-password" required><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required><button class="btn" type="submit">Update password</button></form><p id="reset-message" role="status"></p><a href="index.html">Return to login</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const ready=!!(window.supabase?.createClient&&window.KEMOLUX_SUPABASE_URL&&!window.KEMOLUX_SUPABASE_URL.includes('YOUR-PROJECT')&&window.KEMOLUX_SUPABASE_ANON_KEY&&!window.KEMOLUX_SUPABASE_ANON_KEY.includes('YOUR_SUPABASE'));const db=ready?window.supabase.createClient(window.KEMOLUX_SUPABASE_URL,window.KEMOLUX_SUPABASE_ANON_KEY):null;document.getElementById('reset-password-form').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('new-password').value,b=document.getElementById('confirm-password').value,m=document.getElementById('reset-message');if(a!==b){m.textContent='Passwords do not match.';return}if(!db){m.textContent='Supabase is not configured yet.';return}const {error}=await db.auth.updateUser({password:a});if(error){m.textContent=error.message;return}m.textContent='Password updated. You can now log in.';});</script></body></html>
